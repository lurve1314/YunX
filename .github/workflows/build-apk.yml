# Nightly 测试包构建：每天北京时间 0 点（UTC 16:00）定时跑一次，另支持手动触发。
# 不打 tag、不发 GitHub Release，产物仅上传为 Actions Artifacts。
# Release 包不签名，仅用于每日最新 master 的测试。
name: Nightly Build APK

on:
  # UTC 16:00 = 北京时间 00:00
  schedule:
    - cron: '0 16 * * *'

  # 支持在 Actions 页手动触发
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 防重复：若 master 自上次成功构建以来没有新提交，则跳过本次 nightly
      - name: Skip if master has no new commit since last successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git fetch origin master --quiet

          HEAD_SHA=$(git rev-parse origin/master)
          echo "当前 master HEAD: $HEAD_SHA"

          LAST_SUCCESS=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch master \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""')

          echo "上次成功构建 SHA: ${LAST_SUCCESS:-（无）}"

          if [ -n "$LAST_SUCCESS" ] && [ "$LAST_SUCCESS" = "$HEAD_SHA" ]; then
            echo "::notice::master 自上次成功构建后无新提交，跳过本次 nightly"
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
          fi

      # 构建未签名 Release APK
      - name: Build unsigned release APK
        if: env.SKIP_BUILD != '1'
        env:
          YUNX_USE_MIRROR: 'false'
        run: |
          ./gradlew assembleRelease --no-daemon

      # 检查未签名 APK 是否生成
      - name: Verify APK
        if: env.SKIP_BUILD != '1'
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::未找到未签名 APK: $APK"
            echo "实际 release 输出："
            find app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "APK 构建成功:"
          ls -lh "$APK"

      # 产物上传为 Actions Artifact
      - name: Resolve artifact name
        if: env.SKIP_BUILD != '1'
        run: |
          echo "ARTIFACT_NAME=YunX-nightly-$(date +%Y%m%d)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Upload APK as artifact
        if: env.SKIP_BUILD != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
